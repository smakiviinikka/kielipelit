<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f3eee7;color:#3e342d;text-align:center}
.game{width:min(94%,760px);margin:24px auto;padding:clamp(20px,4vw,36px);background:#fffaf5;border:1px solid #e2d3c5;border-radius:22px;box-shadow:0 10px 32px rgba(70,50,35,.09)}
h1{font-size:clamp(31px,6vw,48px);margin:0 0 8px}
.instructions{font-size:15px;line-height:1.45;margin:0 auto 22px;max-width:570px}

.question{min-height:130px;padding:22px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff;border:1px solid #ead9c9;border-radius:17px;font-size:clamp(21px,4vw,29px);line-height:1.55}
.question em{display:inline-block;margin-top:7px} .question strong{font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:650px;margin:auto}
.answer{min-height:68px;padding:14px;border:2px solid #b8794f;border-radius:13px;background:#f0d2ad;color:#49372a;font-size:clamp(17px,3vw,21px);font-weight:700;cursor:pointer;transition:.12s}
.answer:hover{background:#e8c497} .answer:active{transform:translateY(1px)}
.answer.wrong,.answer.wrong:hover,.answer.wrong:focus{background:#e53935!important;border-color:#b71c1c!important;color:white!important;outline:3px solid #b71c1c!important}
.answer.correct,.answer.correct:hover,.answer.correct:focus{background:#43a047!important;border-color:#1b5e20!important;color:white!important;outline:3px solid #1b5e20!important}
.timertrack{height:12px;max-width:650px;margin:21px auto 5px;background:#ddd3ca;border-radius:8px;overflow:hidden}
.timerbar{height:100%;width:100%;background:#43827a}
.seconds{min-height:18px;font-size:13px;font-weight:700}
.feedback{min-height:30px;margin-top:7px;font-size:20px;font-weight:700}
.result{min-height:32px;font-size:18px;font-weight:700;line-height:1.5}
.unlock{display:none;max-width:430px;margin:17px auto 0;padding:16px;background:#fff;border:1px solid #ead9c9;border-radius:14px}
.unlockrow{display:flex;gap:8px;margin-top:9px}
#code{flex:1;min-width:0;padding:11px;border:2px solid #b8794f;border-radius:9px;font-size:16px}
.unlock button{padding:10px 17px;border:0;border-radius:9px;background:#43827a;color:white;font-weight:700;cursor:pointer}
.codemsg{min-height:21px;margin-top:7px;font-size:14px;font-weight:700}
.modes{display:none;margin-top:17px}
.mode{min-width:112px;margin:4px;padding:10px 13px;border:0;border-radius:9px;font-weight:700;cursor:pointer}
.normal{background:#b9ddb8} .hardcore{background:#d86b63;color:white}
.totalbox{margin:28px auto 0;padding:15px;max-width:650px;background:#e9e1d8;border-radius:13px;font-size:clamp(20px,4vw,27px);font-weight:800;letter-spacing:.02em}
footer{margin-top:28px;font-size:12px;opacity:.68} .version{margin-top:9px;font-size:10px;opacity:.58}
@media(max-width:600px){.game{width:min(97%,560px);margin:9px auto;padding:18px 13px 22px;border-radius:16px}.answers{grid-template-columns:1fr}.answer{min-height:58px;padding:12px 10px}.answer:hover{background:#f0d2ad}.answer.wrong:hover{background:#e53935!important}.answer.correct:hover{background:#43a047!important}.question{min-height:112px;padding:17px 12px}}
</style>
</head>

</div>

<div class="timertrack"><div id="timerbar" class="timerbar"></div></div>
<div id="seconds" class="seconds"></div>
<div id="feedback" class="feedback"></div>
<div id="result" class="result"></div>

<div id="modes" class="modes">

<footer>Yhteistyössä: ChatGPT</footer>
<div class="version">v2.2</div>
</main>

const $=id=>document.getElementById(id);
let round=0,score=0,totalScore=0,correctCount=0,mode="normal",running=false,unlocked=false,current=null,used=new Set(),timer=null,timeLeft=0,roundAdded=false,openingQueue=[];
const SAVE_KEY="sijamuotopeli_v22_state";
function saveState(){localStorage.setItem(SAVE_KEY,JSON.stringify({round,totalScore,unlocked}));}
function loadState(){
 try{
  const x=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if(!x)return;
  if(Number.isInteger(x.round)&&x.round>=0&&x.round<=10)round=x.round;
  if(Number.isFinite(x.totalScore)&&x.totalScore>=0)totalScore=x.totalScore;
  unlocked=!!x.unlocked&&round>0&&round<=10;
  $("round").textContent=round;$("total").textContent=totalScore;
 }catch(e){}
}


function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function showUnlock(){
  running=false;clearInterval(timer);
  $("answers").innerHTML="";$("seconds").textContent="";$("timerbar").style.width="100%";
  $("modes").style.display="none";$("unlock").style.display="block";
  $("unlockTitle").textContent="Avaa kierros "+(round+1);
  $("codemsg").textContent="Syötä opettajan antama koodi.";
  $("code").value="";
  $("question").innerHTML="Valmis seuraavaan kierrokseen?";
}

async function hashCode(v){
  const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function unlockRound(){
  if(round>=10)return;
  const v=$("code").value.trim();
  if(!/^\d{4}$/.test(v)){$("codemsg").textContent="Syötä neljä numeroa.";return}
  if(await hashCode(v)!==ROUND_HASHES[round]){$("codemsg").textContent="Väärä koodi.";$("code").select();return}
  round++;unlocked=true;saveState();
  $("round").textContent=round;$("unlock").style.display="none";$("modes").style.display="block";
  $("question").innerHTML="Koodi oikein!<br><em>Valitse pelitila.</em>";
  $("codemsg").textContent="";
}

function chooseMode(m){
  if(!unlocked)return;
  mode=m;unlocked=false;saveState();startRound();
}

function startRound(){
  score=0;correctCount=0;used.clear();roundAdded=false;running=true;openingQueue=shuffle(BANK.filter(x=>x.level===0)).slice(0,4);
  $("score").textContent=0;$("feedback").textContent="";$("result").textContent="";
  $("modes").style.display="none";showQuestion();
}

function showQuestion(){
  if(!running)return;
  let q;
  if(correctCount<4){
    q=openingQueue[correctCount];
  }else{
    const available=BANK.filter(x=>x.level!==0&&!used.has(x.id)&&(x.level!==2||score>=10));
    if(!available.length){endRound(true);return}
    q=shuffle(available)[0];
  }
  current=q;used.add(q.id);$("question").innerHTML=q.q;$("answers").innerHTML="";
  shuffle(q.a.map((text,index)=>({text,index}))).forEach(o=>{
    const b=document.createElement("button");b.className="answer";b.innerHTML=o.text;b.dataset.index=o.index;
    b.onclick=()=>answer(o.index,b);$("answers").appendChild(b);
  });
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  timeLeft=mode==="hardcore"?3:Math.max(3,15-Math.floor(correctCount/3));
  const start=timeLeft;$("seconds").textContent=Math.ceil(timeLeft)+" s";$("timerbar").style.width="100%";
  timer=setInterval(()=>{
    timeLeft-=.1;$("seconds").textContent=Math.max(0,Math.ceil(timeLeft))+" s";
    $("timerbar").style.width=Math.max(0,timeLeft/start*100)+"%";
    if(timeLeft<=0){clearInterval(timer);wrong(null)}
  },100);
}

function answer(index,button){
  if(!running)return;
  button.blur();
  if(index===current.correct){
    clearInterval(timer);correctCount++;score+=mode==="hardcore"?3:1;$("score").textContent=score;
    $("feedback").textContent="Oikein! ✓";
    setTimeout(()=>{$("feedback").textContent="";showQuestion()},250);
  }else wrong(button);
}

function wrong(button){
  if(!running)return;
  running=false;clearInterval(timer);
  document.querySelectorAll(".answer").forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.index)===current.correct)b.classList.add("correct");
    if(b===button)b.classList.add("wrong");
  });
  endRound(false);
}

function resultText(){
  if(score<=4)return"Hyvä alku!";
  if(score<=9)return"Hyvä! Perussijamuodot alkavat olla hallussa.";
  if(score<=17)return"Hienoa! Tunnistat jo monta sijamuotoa.";
  if(score<=24)return"Todella hyvä! Sijamuodot sujuvat jo hienosti.";
  if(score<=35)return"Mahtavaa! Hallitset sijamuodot hyvin.";
  return"Erinomaista! Vaikeatkin sijamuodot ovat hallussa.";
}

function endRound(allDone){
  running=false;clearInterval(timer);
  if(!roundAdded){totalScore+=score;roundAdded=true;$("total").textContent=totalScore;saveState()}
  $("result").textContent=(allDone?"Kysymykset loppuivat. ":"")+resultText()+" Kierroksen pisteet: "+score+".";
  if(round>=10){
    $("unlock").style.display="none";$("modes").style.display="none";
    $("result").textContent+=" Kaikki 10 kierrosta on pelattu!";
  }else{
    setTimeout(showUnlock,700);
  }
}

loadState();

 $("unlock").style.display="none";$("modes").style.display="none";

 $("result").textContent="Yhteispisteet: "+totalScore+".";
}else if(unlocked){
 $("unlock").style.display="none";$("modes").style.display="block";
 $("question").innerHTML="Kierros "+round+" on avattu.<br><em>Valitse pelitila.</em>";
}else{
 $("unlock").style.display="block";
 $("unlockTitle").textContent="Avaa kierros "+(round+1);
 $("codemsg").textContent="Syötä opettajan antama koodi.";
 if(round>0)$("question").innerHTML="Valmis kierrokselle "+(round+1)+"?";
}
</script>
</body></html>
