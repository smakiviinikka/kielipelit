      font-weight: bold;
      color: #4b4035;
    }

      padding: 22px 18px;
      line-height: 1.35;
      background: #fffaf3;
      border: 1px solid #e7c9aa;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(76, 65, 47, 0.08);
    }

    #question em {
      font-style: italic;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 650px;
      margin: 0 auto;
    }

    button {
      padding: 18px;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #b8794f;
      border-radius: 9px;
      background: #f0d2ad;
      color: #49372a;
      box-shadow: 0 2px 5px rgba(76, 65, 47, 0.10);
    }

    button:hover {
      background: #e5bf94;
    }

    button:disabled {
      cursor: default;
      opacity: 1;
    }

    .wrong-answer {
      outline: 3px solid #9b5f52;
      background: #f0ddd8 !important;
    }

    .correct-answer {
      outline: 3px solid #5f8f58;
      background: #d9ead3 !important;
      border-color: #6a9b62 !important;
      color: #244b20 !important;
    }

      margin: 14px auto 4px;
      max-width: 620px;
    }

    #timerText {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #655044;
    }

    #timeBarOuter {
      width: 100%;
      height: 12px;
      background: #e2d7ca;
      border: 1px solid #b49b82;
      border-radius: 999px;
      overflow: hidden;
    }

    #timeBar {
      width: 100%;
      height: 100%;
      background: #8d7258;
      transition: width 0.1s linear;
    }

    #feedback {
      min-height: 28px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    #gameOver {
      font-size: clamp(18px, 5vw, 28px);
      font-weight: bold;
      margin-top: 25px;
      color: #76523e;
    }

    #finalMessage {
      font-size: clamp(16px, 4vw, 20px);
      margin-top: 8px;
      color: #444;
    }

    #resultFeedback {
      font-size: clamp(17px, 4vw, 21px);
      font-weight: bold;
      margin-top: 8px;
      color: #655044;
    }

    #retryButton {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      display: none;
      background: #43827a;
      color: white;
      border-color: #43573a;
    }

      font-size: 18px;
      color: #333;

      color: #666;

    const TIME_PER_QUESTION = 15;
    let timerInterval = null;
    let timeLeft = TIME_PER_QUESTION;

    let questionNumber = 0;
    let score = 0;
    let correctAnswers = 0;
    let gameMode = "normal";
    let currentQuestion = null;
    let running = false;
    let usedQuestions = new Set();
    let levelQueues = {};
    let currentLevel = 1;

    const buttons = document.querySelectorAll(".buttons button");

    function setMode(mode) {
      gameMode = mode;

      document.getElementById("normalModeButton").classList.toggle("active", mode === "normal");
      document.getElementById("hardcoreModeButton").classList.toggle("active", mode === "hardcore");


      // Vaihdettaessa pelitilaa aloitetaan uusi peli, jotta pisteytys ja ajastin ovat selkeät.
      startGame();
    }

    function getBestScoreData() {
      const bestScore = Number(localStorage.getItem("passiveObjectBestScore") || 0);
      const bestMode = localStorage.getItem("passiveObjectBestScoreMode") || "normal";
      return { bestScore, bestMode };
    }

    function updateHighscoreDisplay() {
      const { bestScore, bestMode } = getBestScoreData();
      const modeText = bestMode === "hardcore" && bestScore > 0 ? " (Hardcore)" : "";
      document.getElementById("highscore").textContent =
        `Parhaat pisteesi: ${bestScore}${modeText}`;
    }

    function saveHighscoreIfNeeded() {
      const { bestScore } = getBestScoreData();

      if (score > bestScore) {
        localStorage.setItem("passiveObjectBestScore", String(score));
        localStorage.setItem("passiveObjectBestScoreMode", gameMode);
      }

      updateHighscoreDisplay();
    }

    function startGame() {
      clearInterval(timerInterval);
      questionNumber = 0;
      score = 0;
      correctAnswers = 0;
      currentQuestion = null;
      running = true;
      usedQuestions = new Set();
      currentLevel = 1;

      // Jokainen vaikeustaso arvotaan omaksi jonokseen. Peli etenee
      // järjestyksessä helposta (1) keskivaikeaan (2) ja vaikeaan (3).
      // Kunkin tason sisällä passiivin ja objektin kysymykset vuorottelevat.
      levelQueues = {};
      [1, 2, 3].forEach(level => {
        levelQueues[level] = {
          passive: shuffleArray(questionBank.filter(q => q.level === level && q.id % 2 === 1)),
          object: shuffleArray(questionBank.filter(q => q.level === level && q.id % 2 === 0))
        };
      });

      document.getElementById("retryButton").style.display = "none";
      document.getElementById("gameOver").textContent = "";
      document.getElementById("finalMessage").textContent = "";
      document.getElementById("resultFeedback").textContent = "";
      document.getElementById("feedback").textContent = "";

      updateScore();
      nextQuestion();
    }

    function getQuestion() {
      // Parittomat kysymykset testaavat passiivimuotoa ja parilliset objektia.
      const wantsPassive = questionNumber % 2 === 0;
      const queueType = wantsPassive ? "passive" : "object";

      while (currentLevel <= 3) {
        const queues = levelQueues[currentLevel];
        const queue = queues[queueType];

        if (queue.length > 0) {
          const candidate = queue.pop();
          if (!usedQuestions.has(candidate)) return candidate;
          continue;
        }

        // Tason molemmat jonot ovat tyhjät: siirrytään seuraavaan tasoon.
        if (queues.passive.length === 0 && queues.object.length === 0) {
          currentLevel++;
          continue;
        }

        // Jos toisen kysymystyypin jono on tyhjä, etsitään seuraava
        // vuorossa oleva kysymys jäljellä olevasta jonosta.
        const otherQueue = queues[queueType === "passive" ? "object" : "passive"];
        if (otherQueue.length > 0) {
          const candidate = otherQueue.pop();
          if (!usedQuestions.has(candidate)) return candidate;
        }
      }

      return null;
    }

    function getTimeForQuestion() {
      if (gameMode === "hardcore") {
        return 3;
      }

      // Normal mode: lähtöaika 15 s. Jokaisen kolmen oikean vastauksen jälkeen
      // seuraavan kysymyksen aika lyhenee yhdellä sekunnilla.
      return Math.max(3, TIME_PER_QUESTION - Math.floor(correctAnswers / 3));
    }

    function updateTimerDisplay(totalTime) {
      const shownTime = Math.max(0, Math.ceil(timeLeft));
      document.getElementById("timerText").textContent = `Aikaa: ${shownTime} s`;
      const percent = Math.max(0, Math.min(100, (timeLeft / totalTime) * 100));
      document.getElementById("timeBar").style.width = `${percent}%`;
    }

    function startTimer() {
      clearInterval(timerInterval);

      const totalTime = getTimeForQuestion();
      timeLeft = totalTime;
      updateTimerDisplay(totalTime);

      const startedAt = Date.now();

      timerInterval = setInterval(() => {
        if (!running) {
          clearInterval(timerInterval);
          return;
        }

        const elapsed = (Date.now() - startedAt) / 1000;
        timeLeft = totalTime - elapsed;
        updateTimerDisplay(totalTime);

        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerDisplay(totalTime);
          clearInterval(timerInterval);
          buttons.forEach(btn => btn.disabled = true);
          endGame("Aika loppui! ⏱️");
        }
      }, 100);
    }

    function nextQuestion() {
      if (!running) return;

      currentQuestion = getQuestion();

      if (!currentQuestion) {
        winGame();
        return;
      }

      usedQuestions.add(currentQuestion);

      questionNumber++;

      document.getElementById("questionNumberText").textContent =
        `Kysymys ${questionNumber}`;

      document.getElementById("question").innerHTML = currentQuestion.q;
      document.getElementById("feedback").textContent = "";

      const answers = shuffleArray(currentQuestion.a.map((text, index) => ({
        text: text,
        originalIndex: index
      })));

      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }

      buttons.forEach((btn, i) => {
        btn.disabled = false;
        btn.classList.remove("wrong-answer", "correct-answer");
        btn.textContent = answers[i].text;
        btn.dataset.originalIndex = answers[i].originalIndex;
        btn.onclick = () => answer(answers[i].originalIndex, btn);
      });

      startTimer();
    }

    function shuffleArray(array) {
      // Fisher–Yates
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function answer(choice, selectedButton) {
      if (!running) return;

      if (selectedButton && typeof selectedButton.blur === "function") {
        selectedButton.blur();
      }

      clearInterval(timerInterval);
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.correct) {
        correctAnswers++;
        score += gameMode === "hardcore" ? 3 : 1;
        document.getElementById("feedback").textContent = "Oikein! ✓";
        updateScore();

        // Pieni tauko tekee palautteesta näkyvän ilman, että peli tuntuu tahmealta.
        setTimeout(() => {
          if (running) nextQuestion();
        }, 250);

      } else {
        buttons.forEach(btn => {
          btn.classList.remove("wrong-answer", "correct-answer");
          const originalIndex = Number(btn.dataset.originalIndex);

          if (originalIndex === currentQuestion.correct) {
            btn.classList.add("correct-answer");
          }

          if (btn === selectedButton && originalIndex !== currentQuestion.correct) {
            btn.classList.add("wrong-answer");
          }

          btn.disabled = true;
        });
        endGame("Väärä vastaus! ❌");
      }
    }

    function getResultMessage(score) {
  if (score <= 4) {
    return "Hyvä yritys! Harjoittele vielä.";
  } else if (score <= 9) {
    return "Hyvä! Jatka harjoittelua!";
  } else if (score <= 17) {
    return "Hienoa! Osaat jo monta passiivin muotoa!";
  } else if (score <= 24) {
    return "Todella hyvä! Passiivi alkaa sujua!";
  } else if (score <= 30) {
    return "Mahtavaa! Osaat passiivin ja objektin jo hyvin!";
  } else if (score <= 50) {
    return "Erinomaista! Passiivi ja objekti ovat hyvin hallussa!";
  } else {
    return "Huipputulos! Olet passiivin mestari!";
  }
}



    function winGame() {
      clearInterval(timerInterval);
      running = false;

      buttons.forEach(btn => btn.disabled = true);

      document.getElementById("feedback").textContent = "";
      document.getElementById("gameOver").textContent =
        "🎉 Kaikki kysymykset suoritettu!";

      document.getElementById("finalMessage").textContent =
        gameMode === "hardcore"
          ? `Lopulliset pisteesi: ${score} · Oikein: ${correctAnswers}`
          : `Lopulliset pisteesi: ${score} / ${questionBank.length}`;
      document.getElementById("resultFeedback").textContent =
        getResultMessage(score);

      updateScore();
      saveHighscoreIfNeeded();
      document.getElementById("retryButton").style.display = "inline-block";
    }

    function updateScore() {
      document.getElementById("score").textContent =
        gameMode === "hardcore"
          ? `Pisteet: ${score} · Hardcore`
          : `Pisteet: ${score}`;
    }

    function endGame(message) {
      if (!running) return;

      clearInterval(timerInterval);
      running = false;

      buttons.forEach(btn => btn.disabled = true);

      document.getElementById("feedback").textContent = "";
      document.getElementById("gameOver").textContent = message;

      document.getElementById("finalMessage").textContent =
        gameMode === "hardcore"
          ? `Lopulliset pisteesi: ${score} · Oikein: ${correctAnswers}`
          : `Lopulliset pisteesi: ${score}`;
      document.getElementById("resultFeedback").textContent =
        getResultMessage(score);

      updateScore();
      saveHighscoreIfNeeded();
      document.getElementById("retryButton").style.display = "inline-block";
    }

    updateScore();
    updateHighscoreDisplay();
    startGame();
  </script>
