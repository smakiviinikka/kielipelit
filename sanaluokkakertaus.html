    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 18px 10px 30px;
      min-height: 100vh;
      box-sizing: border-box;
      background: #eef3fa;
      color: #28364a;
    }

    h1 {
      font-size: clamp(28px, 6vw, 40px);
      margin-bottom: 8px;
      color: #465f8a;
    }

    #instructions {
      font-weight: bold;
      font-size: clamp(16px, 4vw, 20px);
      margin: 0 auto 15px;
      max-width: 800px;
    }

    #score, #levelText {
      font-size: clamp(16px, 4vw, 20px);
      margin-bottom: 6px;
    }

    #questionNumberText {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #4b4035;
    }


    #question {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: bold;
      max-width: 900px;
      margin: 25px auto 20px;
      padding: 22px 18px;
      line-height: 1.35;
      background: #f8f7fc;
      border: 1px solid #c9cce0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(76, 65, 47, 0.08);
    }

    #question em {
      font-style: italic;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 650px;
      margin: 0 auto;
    }

    button {
      padding: 18px;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #7d91b5;
      border-radius: 9px;
      background: #c9d5eb;
      color: #26344c;
      box-shadow: 0 2px 5px rgba(76, 65, 47, 0.10);
    }

    button:hover {
      background: #b9c8e2;
    }

    button:disabled {
      cursor: default;
      opacity: 1;
    }

    .wrong-answer {
      outline: 3px solid #9b5f52;
      background: #f0ddd8 !important;
    }


    #timerArea {
      margin: 14px auto 4px;
      max-width: 620px;
    }

    #timerText {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #44536d;
    }

    #timeBarOuter {
      width: 100%;
      height: 12px;
      background: #e2d7ca;
      border: 1px solid #b49b82;
      border-radius: 999px;
      overflow: hidden;
    }

    #timeBar {
      width: 100%;
      height: 100%;
      background: #8d7258;
      transition: width 0.1s linear;
    }

    #feedback {
      min-height: 28px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    #gameOver {
      font-size: clamp(18px, 5vw, 28px);
      font-weight: bold;
      margin-top: 25px;
      color: #76523e;
    }

    #finalMessage {
      font-size: clamp(16px, 4vw, 20px);
      margin-top: 8px;
      color: #444;
    }

    #resultFeedback {
      font-size: clamp(17px, 4vw, 21px);
      font-weight: bold;
      margin-top: 8px;
      color: #44536d;
    }

    #retryButton {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      display: none;
      background: #526fa3;
      color: white;
      border-color: #43573a;
    }

    #retryButton:hover {
      background: #465c3c;
    }

    #highscore {
      margin-top: 30px;
      font-size: 18px;
      color: #333;
    }

    #logoFooter {
      margin-top: 40px;
    }

    #logoFooter .collabLabel {
      font-size: 16px;
      color: #666;
      margin-bottom: 4px;
    }

    #logoFooter .logoText {
      font-size: 20px;
      font-weight: bold;
    }

    #logoFooter span {
      color: #617d52;
    }

    @media (max-width: 600px) {
      .buttons {
        grid-template-columns: 1fr;
      }
      button {
        padding: 15px;
      }
    }
  
    #modeControls {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    #modeControls .modeButton {
      padding: 4px 8px;
      min-width: 0;
      width: auto;
      font-size: 11px;
      line-height: 1.2;
      font-weight: bold;
      border-radius: 7px;
      cursor: pointer;
    }

    #modeControls .modeButton.normal {
      background: #dff0d8 !important;
      border: 1px solid #7fa56f !important;
      color: #294323 !important;
    }

    #modeControls .modeButton.hardcore {
      background: #e7a0a0 !important;
      border: 1px solid #a94d4d !important;
      color: #5a1f1f !important;
    }

    #modeControls .modeButton.normal.active {
      outline: 2px solid #5c7c50;
      outline-offset: 1px;
    }

    #modeControls .modeButton.hardcore.active {
      outline: 2px solid #9a3434;
      outline-offset: 1px;
    }

  </style>
</head>

    const TIME_PER_QUESTION = 15;
    let timerInterval = null;
    let timeLeft = TIME_PER_QUESTION;

    let questionNumber = 0;
    let score = 0;
    let correctAnswers = 0;
    let gameMode = "normal";
    let currentQuestion = null;
    let running = false;
    let usedQuestions = new Set();
    let easyQueue = [];
    let mixedQueue = [];

    const buttons = document.querySelectorAll(".buttons button");

    function setMode(mode) {
      gameMode = mode;

      document.getElementById("normalModeButton").classList.toggle("active", mode === "normal");
      document.getElementById("hardcoreModeButton").classList.toggle("active", mode === "hardcore");


      // Vaihdettaessa pelitilaa aloitetaan uusi peli, jotta pisteytys ja ajastin ovat selkeät.
      startGame();
    }

    function getBestScoreData() {
      const bestScore = Number(localStorage.getItem("wordClassBestScore") || 0);
      const bestMode = localStorage.getItem("wordClassBestScoreMode") || "normal";
      return { bestScore, bestMode };
    }

    function updateHighscoreDisplay() {
      const { bestScore, bestMode } = getBestScoreData();
      const modeText = bestMode === "hardcore" && bestScore > 0 ? " (Hardcore)" : "";
      document.getElementById("highscore").textContent =
        `Parhaat pisteesi: ${bestScore}${modeText}`;
    }

    function saveHighscoreIfNeeded() {
      const { bestScore } = getBestScoreData();

      if (score > bestScore) {
        localStorage.setItem("wordClassBestScore", String(score));
        localStorage.setItem("wordClassBestScoreMode", gameMode);
      }

      updateHighscoreDisplay();
    }

    function startGame() {
      clearInterval(timerInterval);
      questionNumber = 0;
      score = 0;
      correctAnswers = 0;
      currentQuestion = null;
      running = true;
      usedQuestions = new Set();
      // Ensimmäiset viisi ovat satunnaisia helppoja kysymyksiä.
      easyQueue = shuffleArray(questionBank.filter(q => q.level === 1).slice());
      mixedQueue = [];

      document.getElementById("retryButton").style.display = "none";
      document.getElementById("gameOver").textContent = "";
      document.getElementById("finalMessage").textContent = "";
      document.getElementById("resultFeedback").textContent = "";
      document.getElementById("feedback").textContent = "";

      updateScore();
      nextQuestion();
    }

    function getQuestion() {
      // Ensimmäiset viisi kysymystä arvotaan helppojen kysymysten joukosta.
      if (questionNumber < 5) {
        while (easyQueue.length > 0) {
          const candidate = easyQueue.shift();
          if (!usedQuestions.has(candidate)) return candidate;
        }
      }

      // Viiden ensimmäisen jälkeen kaikki jäljellä olevat helpot ja vaikeat
      // kysymykset sekoitetaan yhdeksi satunnaiseksi jonoksi.
      if (mixedQueue.length === 0) {
        const remaining = questionBank.filter(q => !usedQuestions.has(q));
        mixedQueue = shuffleArray(remaining.slice());
      }

      while (mixedQueue.length > 0) {
        const candidate = mixedQueue.shift();
        if (!usedQuestions.has(candidate)) return candidate;
      }

      return null;
    }

    function getTimeForQuestion() {
      if (gameMode === "hardcore") {
        return 3;
      }

      // Normal mode: lähtöaika 15 s. Jokaisen kolmen oikean vastauksen jälkeen
      // seuraavan kysymyksen aika lyhenee yhdellä sekunnilla.
      return Math.max(3, TIME_PER_QUESTION - Math.floor(correctAnswers / 3));
    }

    function updateTimerDisplay(totalTime) {
      const shownTime = Math.max(0, Math.ceil(timeLeft));
      document.getElementById("timerText").textContent = `Aikaa: ${shownTime} s`;
      const percent = Math.max(0, Math.min(100, (timeLeft / totalTime) * 100));
      document.getElementById("timeBar").style.width = `${percent}%`;
    }

    function startTimer() {
      clearInterval(timerInterval);

      const totalTime = getTimeForQuestion();
      timeLeft = totalTime;
      updateTimerDisplay(totalTime);

      const startedAt = Date.now();

      timerInterval = setInterval(() => {
        if (!running) {
          clearInterval(timerInterval);
          return;
        }

        const elapsed = (Date.now() - startedAt) / 1000;
        timeLeft = totalTime - elapsed;
        updateTimerDisplay(totalTime);

        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerDisplay(totalTime);
          clearInterval(timerInterval);
          buttons.forEach(btn => btn.disabled = true);
          endGame("Aika loppui! ⏱️");
        }
      }, 100);
    }

    function nextQuestion() {
      if (!running) return;

      currentQuestion = getQuestion();

      if (!currentQuestion) {
        winGame();
        return;
      }

      usedQuestions.add(currentQuestion);

      questionNumber++;

      document.getElementById("questionNumberText").textContent =
        `Kysymys ${questionNumber}`;

      document.getElementById("question").innerHTML = currentQuestion.q;
      document.getElementById("feedback").textContent = "";

      const answers = shuffleArray(currentQuestion.a.map((text, index) => ({
        text: text,
        originalIndex: index
      })));

      buttons.forEach((btn, i) => {
        btn.disabled = false;
        btn.classList.remove("wrong-answer");
        btn.textContent = answers[i].text;
        btn.onclick = () => answer(answers[i].originalIndex, btn);
      });

      startTimer();
    }

    function shuffleArray(array) {
      // Fisher–Yates
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function answer(choice, selectedButton) {
      if (!running) return;

      clearInterval(timerInterval);
      buttons.forEach(btn => btn.disabled = true);

      if (choice === currentQuestion.correct) {
        correctAnswers++;
        score += gameMode === "hardcore" ? 3 : 1;
        document.getElementById("feedback").textContent = "Oikein! ✓";
        updateScore();

        // Pieni tauko tekee palautteesta näkyvän ilman, että peli tuntuu tahmealta.
        setTimeout(() => {
          if (running) nextQuestion();
        }, 250);

      } else {
        if (selectedButton) {
          selectedButton.classList.add("wrong-answer");
        }
        endGame("Väärä vastaus! ❌");
      }
    }

    function getResultMessage(score) {
      if (score <= 4) {
        return "Okei, lisää harjoitusta!";
      } else if (score <= 9) {
        return "Ihan hyvät pisteet jo!";
      } else if (score <= 17) {
        return "Pronominit alkaa olla hallussa!";
      } else if (score <= 24) {
        return "Oho! Todella kova tulos!";
      } else if (score <= 30) {
        return "Mitä!? Jäätävät pisteet!";
      } else if (score <= 50) {
        return "Osaat jo melkein paremmin kuin Sami! Huikeaa!";
      } else {
        return "Pronominitehtävät suoritettu kiitettävin pistein! Onneksi olkoon!";
      }
    }

    function winGame() {
      clearInterval(timerInterval);
      running = false;

      buttons.forEach(btn => btn.disabled = true);

      document.getElementById("feedback").textContent = "";
      document.getElementById("gameOver").textContent =
        "🎉 Kaikki kysymykset suoritettu!";

      document.getElementById("finalMessage").textContent =
        gameMode === "hardcore"
          ? `Lopulliset pisteesi: ${score} · Oikein: ${correctAnswers}`
          : `Lopulliset pisteesi: ${score} / ${questionBank.length}`;
      document.getElementById("resultFeedback").textContent =
        getResultMessage(score);

      updateScore();
      saveHighscoreIfNeeded();
      document.getElementById("retryButton").style.display = "inline-block";
    }

    function updateScore() {
      document.getElementById("score").textContent =
        gameMode === "hardcore"
          ? `Pisteet: ${score} · Hardcore`
          : `Pisteet: ${score}`;
    }

    function endGame(message) {
      if (!running) return;

      clearInterval(timerInterval);
      running = false;

      buttons.forEach(btn => btn.disabled = true);

      document.getElementById("feedback").textContent = "";
      document.getElementById("gameOver").textContent = message;

      document.getElementById("finalMessage").textContent =
        gameMode === "hardcore"
          ? `Lopulliset pisteesi: ${score} · Oikein: ${correctAnswers}`
          : `Lopulliset pisteesi: ${score}`;
      document.getElementById("resultFeedback").textContent =
        getResultMessage(score);

      updateScore();
      saveHighscoreIfNeeded();
      document.getElementById("retryButton").style.display = "inline-block";
    }

    updateScore();
    updateHighscoreDisplay();
    startGame();
  </script>
